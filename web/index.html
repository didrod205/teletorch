<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Teletorch</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#000;color:#fff;font-family:Consolas,"Courier New",Courier,monospace;min-height:100vh;user-select:none}
body{display:flex;flex-direction:column;align-items:center;padding:8px 4px 16px}

/* TV screen: exact 40-col monospace grid */
#screen-wrap{
  position:relative;
  background:#000;
  border:1px solid #333;
  overflow:hidden;
  cursor:crosshair;
  /* width set by JS */
}
#screen{
  display:block;
  white-space:pre;
  line-height:1.15;
  /* font-size and width set by JS */
}
/* Each row span */
.row{
  display:block;
  white-space:pre;
  overflow:hidden;
  font-family:inherit;
  font-size:inherit;
  line-height:inherit;
  font-style:normal;
}

/* Title band: row index 1 -- blue BG, yellow text */
.row-title{
  background:#0000C8;
  display:block;
}

/* Fastext row: row index 23 -- coloured labels */
.row-fastext .ft-red    { color:#f00 }
.row-fastext .ft-green  { color:#0f0 }
.row-fastext .ft-yellow { color:#ff0 }
.row-fastext .ft-cyan   { color:#0ff }
.row-fastext .ft-white  { color:#fff }

/* Torch overlay */
#torch-overlay{
  position:absolute;inset:0;
  pointer-events:none;
  display:none;
  z-index:5;
}
body.torch-on #torch-overlay{display:block}

/* Colour classes for normal rows */
.c-white   {color:#fff}
.c-yellow  {color:#ff0}
.c-cyan    {color:#0ff}
.c-green   {color:#0f0}
.c-red     {color:#f00}
.c-magenta {color:#f0f}
.c-blue    {color:#4d7cff}
.c-title   {color:#ff0}  /* yellow text on blue BG */

/* Controls below the screen */
#controls{
  margin-top:6px;
  display:flex;
  flex-direction:column;
  gap:6px;
  /* width matched to screen-wrap by JS */
}

/* Digit display */
#digit-display{
  font-size:clamp(16px,3.5vw,32px);
  color:#ff0;
  letter-spacing:4px;
  text-align:center;
  border-bottom:2px solid #ff0;
  padding:2px 0;
  min-width:4ch;
  display:inline-block;
}
#digit-label{
  color:#888;
  font-size:clamp(9px,1.4vw,12px);
  margin-right:6px;
  display:inline;
}
#digit-row{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:8px;
}

/* Fastext buttons row */
#fastext-row{
  display:flex;
  gap:4px;
}
.fbtn{
  flex:1;
  padding:5px 2px;
  background:#111;
  border:none;
  cursor:pointer;
  font-family:inherit;
  font-size:clamp(9px,1.6vw,13px);
  text-align:center;
  font-style:normal;
  font-weight:bold;
  color:#000;
}
.fbtn:hover{filter:brightness(1.2)}
.fbtn:active{filter:brightness(0.7)}
.fbtn-red    {background:#f00}
.fbtn-green  {background:#0f0}
.fbtn-yellow {background:#ff0}
.fbtn-cyan   {background:#0ff}

/* Keypad */
#keypad-area{
  display:flex;
  gap:8px;
  align-items:flex-start;
  flex-wrap:wrap;
}
#keypad{
  display:grid;
  gap:3px;
}
/* desktop: 1 row of 11 buttons */
#keypad.kp-wide{
  grid-template-columns:repeat(11,1fr);
}
/* mobile: 4x3 grid */
#keypad.kp-narrow{
  grid-template-columns:repeat(3,1fr);
}
.kbtn{
  background:#111;color:#fff;border:1px solid #555;
  padding:5px 0;
  cursor:pointer;font-family:inherit;
  font-size:clamp(11px,1.8vw,15px);
  text-align:center;
  min-width:28px;
}
.kbtn:hover{background:#333}
.kbtn:active{background:#555}
.kbtn-back{color:#ff0;border-color:#ff0}
.kbtn-back:hover{background:#332200}

/* Sub-page arrows */
#subpage-btns{
  display:flex;flex-direction:column;gap:3px;
}
.spbtn{
  background:#111;color:#fff;border:1px solid #555;
  padding:5px 8px;cursor:pointer;font-family:inherit;
  font-size:clamp(11px,1.8vw,14px);
}
.spbtn:hover{background:#333}

/* Place bar */
#place-bar{
  display:flex;
  gap:5px;
  align-items:center;
  flex-wrap:wrap;
}
#place-bar label{color:#0ff;font-size:clamp(10px,1.6vw,13px)}
#place-input{
  flex:1;min-width:100px;
  background:#111;color:#fff;border:1px solid #444;
  padding:4px 5px;font-family:inherit;
  font-size:clamp(10px,1.6vw,13px);
}
#place-input:focus{outline:1px solid #0ff}
#place-btn{
  background:#111;color:#0ff;border:1px solid #0ff;
  padding:4px 8px;cursor:pointer;font-family:inherit;
  font-size:clamp(10px,1.6vw,13px);
}
#place-btn:hover{background:#0ff;color:#000}
#place-name{color:#0f0;font-size:clamp(9px,1.4vw,12px);min-width:60px}

/* Torch row */
#torch-row{
  display:flex;align-items:center;gap:6px;
}
#torch-label{color:#888;font-size:clamp(9px,1.4vw,12px)}
#torch-btn{
  background:#111;color:#888;border:1px solid #444;
  padding:3px 8px;cursor:pointer;font-family:inherit;
  font-size:clamp(9px,1.4vw,12px);
}
body.torch-on #torch-btn{color:#ff0;border-color:#ff0}

/* Footer */
#footer{
  margin-top:6px;
  color:#555;
  font-size:clamp(8px,1.2vw,10px);
  text-align:center;
}
#footer a{color:#4d7cff;text-decoration:none}
#footer a:hover{text-decoration:underline}

/* Aria-live hidden text */
#a11y-text{
  position:absolute;
  width:1px;height:1px;
  overflow:hidden;clip:rect(0,0,0,0);
  white-space:pre;
}
</style>
</head>
<body>

<div id="screen-wrap" tabindex="0" aria-label="Teletext screen" role="region">
  <div id="screen" aria-hidden="true"></div>
  <canvas id="torch-overlay" aria-hidden="true"></canvas>
</div>

<div id="controls">
  <div id="fastext-row" role="group" aria-label="Fastext quick links">
    <button class="fbtn fbtn-red"    id="ft-red"    aria-label="Red fastext">---</button>
    <button class="fbtn fbtn-green"  id="ft-green"  aria-label="Green fastext">---</button>
    <button class="fbtn fbtn-yellow" id="ft-yellow" aria-label="Yellow fastext">---</button>
    <button class="fbtn fbtn-cyan"   id="ft-cyan"   aria-label="Cyan fastext">---</button>
  </div>

  <div id="keypad-area">
    <div>
      <div id="digit-row">
        <span id="digit-label">P</span>
        <div id="digit-display" aria-live="polite" aria-label="Page number being typed">___</div>
      </div>
    </div>
    <div id="keypad" class="kp-wide" role="group" aria-label="Page number keypad">
      <button class="kbtn" data-d="1" aria-label="1">1</button>
      <button class="kbtn" data-d="2" aria-label="2">2</button>
      <button class="kbtn" data-d="3" aria-label="3">3</button>
      <button class="kbtn" data-d="4" aria-label="4">4</button>
      <button class="kbtn" data-d="5" aria-label="5">5</button>
      <button class="kbtn" data-d="6" aria-label="6">6</button>
      <button class="kbtn" data-d="7" aria-label="7">7</button>
      <button class="kbtn" data-d="8" aria-label="8">8</button>
      <button class="kbtn" data-d="9" aria-label="9">9</button>
      <button class="kbtn" data-d="0" aria-label="0">0</button>
      <button class="kbtn kbtn-back" id="btn-back" aria-label="Back/clear">Bk</button>
    </div>
    <div id="subpage-btns" aria-label="Sub-page navigation">
      <button class="spbtn" id="btn-prev" aria-label="Previous sub-page">&lt; Prev</button>
      <button class="spbtn" id="btn-next" aria-label="Next sub-page">Next &gt;</button>
    </div>
  </div>

  <div id="place-bar">
    <label for="place-input">Place:</label>
    <input id="place-input" type="text" placeholder="City or lat,lon" autocomplete="off" aria-label="Set place">
    <button id="place-btn" aria-label="Set place">Set</button>
    <span id="place-name" aria-live="polite"></span>
  </div>

  <div id="torch-row">
    <span id="torch-label">Torch:</span>
    <button id="torch-btn" aria-pressed="false" aria-label="Toggle torch mode">Off</button>
  </div>
</div>

<div id="footer">
  Data: USGS, NASA EONET, Open-Meteo (<a href="/p/199" target="_blank">CC BY 4.0</a>).
  Text: <a href="/p/100.txt">/p/100.txt</a>
</div>

<pre id="a11y-text" aria-live="polite" aria-atomic="true"></pre>

<script>
(function(){
'use strict';

// ---------------------------------------------------------------------------
// State
// ---------------------------------------------------------------------------
var curPage   = 100;
var curSub    = 1;
var curSubs   = 1;
var curLinks  = [];
var digits    = '';
var torchOn   = false;
var torchRow  = 12;
var fetchCtrl = null;

// ---------------------------------------------------------------------------
// Colour map
// ---------------------------------------------------------------------------
var COL = {
  white:   '#ffffff',
  yellow:  '#ffff00',
  cyan:    '#00ffff',
  green:   '#00ff00',
  red:     '#ff0000',
  magenta: '#ff00ff',
  blue:    '#4d7cff',
  title:   '#ffff00'   // yellow text, but row gets blue BG via row-title class
};

// ---------------------------------------------------------------------------
// DOM refs
// ---------------------------------------------------------------------------
var screen      = document.getElementById('screen');
var overlay     = document.getElementById('torch-overlay');
var digitDisp   = document.getElementById('digit-display');
var placeInput  = document.getElementById('place-input');
var placeBtn    = document.getElementById('place-btn');
var placeName   = document.getElementById('place-name');
var torchBtn    = document.getElementById('torch-btn');
var a11yText    = document.getElementById('a11y-text');
var screenWrap  = document.getElementById('screen-wrap');
var controls    = document.getElementById('controls');
var keypad      = document.getElementById('keypad');
var ftBtns      = {
  red:    document.getElementById('ft-red'),
  green:  document.getElementById('ft-green'),
  yellow: document.getElementById('ft-yellow'),
  cyan:   document.getElementById('ft-cyan')
};

// ---------------------------------------------------------------------------
// Build the 24 row divs once
// ---------------------------------------------------------------------------
var rowDivs = [];
for (var i = 0; i < 24; i++) {
  var d = document.createElement('div');
  d.className = 'row';
  screen.appendChild(d);
  rowDivs.push(d);
}

// ---------------------------------------------------------------------------
// Font sizing: measure actual char width then scale to fill screen
// ---------------------------------------------------------------------------
var measureSpan = document.createElement('span');
measureSpan.style.cssText = 'position:absolute;visibility:hidden;white-space:pre;font-family:Consolas,"Courier New",Courier,monospace;font-size:100px';
measureSpan.textContent = '0'.repeat(40);
document.body.appendChild(measureSpan);

function computeScreenWidth() {
  // Screen width = min(1000px, 94vw, (innerHeight - 230px) * 4/3)
  var vw94 = window.innerWidth * 0.94;
  var fromH = (window.innerHeight - 230) * (4 / 3);
  return Math.max(200, Math.min(1000, Math.min(vw94, fromH)));
}

function syncLayout() {
  var sw = computeScreenWidth();
  screenWrap.style.width = sw + 'px';
  controls.style.width = sw + 'px';

  // Measure: how wide is a 40-char string at 100px?
  measureSpan.style.fontSize = '100px';
  var charW100 = measureSpan.offsetWidth / 40;
  // Target: 40 chars fill sw px
  var fs = sw / (charW100 / 100);   // fs = sw * 100 / charW100
  // Clamp to reasonable range
  fs = Math.max(6, Math.min(40, fs));
  screen.style.fontSize = fs + 'px';

  // Screen height = 24 lines * lineHeight
  var lh = fs * 1.15;
  screenWrap.style.height = Math.ceil(24 * lh) + 'px';

  // Keypad layout: wide if > 600px, narrow otherwise
  if (sw >= 560) {
    keypad.className = 'kp-wide';
  } else {
    keypad.className = 'kp-narrow';
  }

  // Canvas sync
  overlay.width  = screenWrap.offsetWidth;
  overlay.height = screenWrap.offsetHeight;
}

// ---------------------------------------------------------------------------
// Render page data into the screen
// ---------------------------------------------------------------------------

// Parse fastext row (row 23) into coloured spans.
// Each 10-char slot maps to a colour.
function renderFastextRow(text, links) {
  var rowEl = rowDivs[23];
  rowEl.className = 'row row-fastext';
  rowEl.innerHTML = '';

  // Build a map: slot index -> colour
  var slotColors = ['white', 'white', 'white', 'white'];
  var colorOrder = ['red', 'green', 'yellow', 'cyan'];
  for (var i = 0; i < links.length; i++) {
    var idx = colorOrder.indexOf(links[i].color);
    if (idx !== -1) slotColors[idx] = links[i].color;
  }

  for (var s = 0; s < 4; s++) {
    var chunk = (text || '').slice(s * 10, s * 10 + 10);
    if (chunk.length < 10) chunk = chunk + ' '.repeat(10 - chunk.length);
    var sp = document.createElement('span');
    sp.className = 'ft-' + slotColors[s];
    sp.textContent = chunk;
    rowEl.appendChild(sp);
  }
}

function renderPage(data) {
  var rows   = data.rows   || [];
  var colors = data.colors || [];
  curLinks = data.links || [];
  curSubs  = data.subs  || 1;
  curSub   = data.sub   || 1;

  var plainText = '';
  for (var i = 0; i < 24; i++) {
    var text  = rows[i]   || '                                        ';
    var color = colors[i] || 'white';

    if (i === 23) {
      // Fastext row: multi-colour spans
      renderFastextRow(text, curLinks);
    } else if (i === 1 || color === 'title') {
      // Title band: blue BG, yellow text
      rowDivs[i].className = 'row row-title c-title';
      rowDivs[i].textContent = text;
    } else {
      var col = COL[color] || '#ffffff';
      rowDivs[i].className = 'row';
      rowDivs[i].style.color = col;
      rowDivs[i].textContent = text;
    }

    plainText += text + '\n';
  }

  // Aria-live text
  a11yText.textContent = (data.title || '') + '\n' + plainText;

  // Fastext button labels
  var colorOrder = ['red','green','yellow','cyan'];
  colorOrder.forEach(function(c){ ftBtns[c].textContent = '---'; ftBtns[c].dataset.num = ''; });
  curLinks.forEach(function(lk){
    if (ftBtns[lk.color]) {
      ftBtns[lk.color].textContent = lk.num + ' ' + (lk.label || '');
      ftBtns[lk.color].dataset.num = lk.num;
    }
  });

  if (data.placeName) placeName.textContent = data.placeName;

  drawTorch();
}

// ---------------------------------------------------------------------------
// Fetch a page
// ---------------------------------------------------------------------------
function loadPage(num, sub, extra) {
  sub   = sub   || 1;
  extra = extra || '';
  if (fetchCtrl) fetchCtrl.abort();
  fetchCtrl = (typeof AbortController !== 'undefined') ? new AbortController() : null;

  var url = '/p/' + String(num).padStart(3,'0') + '.json?s=' + sub + extra;
  var opts = { credentials: 'include' };
  if (fetchCtrl) opts.signal = fetchCtrl.signal;

  fetch(url, opts)
    .then(function(r){ return r.json(); })
    .then(function(data){
      curPage = num;
      curSub  = sub;
      curSubs = data.subs || 1;
      renderPage(data);
      var histUrl = '/p/' + String(num).padStart(3,'0') + (sub > 1 ? '?s=' + sub : '');
      if (window.location.pathname !== '/p/' + String(num).padStart(3,'0')) {
        history.pushState({ num:num, sub:sub }, '', histUrl);
      }
    })
    .catch(function(e){
      if (e && e.name === 'AbortError') return;
      showError('Failed to load page ' + num);
    });
}

function showError(msg) {
  var blank = '                                        ';
  for (var i = 0; i < 24; i++) {
    rowDivs[i].className = 'row';
    rowDivs[i].style.color = '#ffffff';
    rowDivs[i].textContent = blank;
  }
  rowDivs[1].className = 'row row-title c-title';
  rowDivs[1].textContent = 'ERROR                                   ';
  rowDivs[3].style.color = '#ff0000';
  rowDivs[3].textContent = (msg + blank).slice(0, 40);
  a11yText.textContent = 'Error: ' + msg;
}

// ---------------------------------------------------------------------------
// Digit entry
// ---------------------------------------------------------------------------
function pushDigit(d) {
  if (digits.length >= 3) digits = '';
  digits += d;
  var disp = digits + '___';
  digitDisp.textContent = disp.slice(0, 3);
  if (digits.length === 3) {
    var num = parseInt(digits, 10);
    digits = '';
    digitDisp.textContent = '___';
    loadPage(num, 1);
  }
}

function clearDigits() {
  digits = '';
  digitDisp.textContent = '___';
}

// ---------------------------------------------------------------------------
// Keyboard
// ---------------------------------------------------------------------------
document.addEventListener('keydown', function(e) {
  if (document.activeElement === placeInput) return;

  if (e.key >= '0' && e.key <= '9') { e.preventDefault(); pushDigit(e.key); return; }
  if (e.key === 'Backspace') { e.preventDefault(); clearDigits(); return; }
  if (e.key === 'ArrowRight' || e.key === 'PageDown') {
    e.preventDefault();
    if (curSub < curSubs) loadPage(curPage, curSub + 1);
    return;
  }
  if (e.key === 'ArrowLeft' || e.key === 'PageUp') {
    e.preventDefault();
    if (curSub > 1) loadPage(curPage, curSub - 1);
    return;
  }
  if (e.key === 'F1' || e.key === 'r') { e.preventDefault(); fastextGo('red');    return; }
  if (e.key === 'F2' || e.key === 'g') { e.preventDefault(); fastextGo('green');  return; }
  if (e.key === 'F3' || e.key === 'y') { e.preventDefault(); fastextGo('yellow'); return; }
  if (e.key === 'F4' || e.key === 'c') { e.preventDefault(); fastextGo('cyan');   return; }
  if (torchOn) {
    if (e.key === 'ArrowUp')   { e.preventDefault(); torchRow = Math.max(0,  torchRow - 1); drawTorch(); return; }
    if (e.key === 'ArrowDown') { e.preventDefault(); torchRow = Math.min(23, torchRow + 1); drawTorch(); return; }
  }
});

function fastextGo(color) {
  var btn = ftBtns[color];
  if (btn && btn.dataset.num) loadPage(parseInt(btn.dataset.num, 10), 1);
}

// ---------------------------------------------------------------------------
// Keypad buttons
// ---------------------------------------------------------------------------
document.getElementById('keypad').addEventListener('click', function(e) {
  var btn = e.target.closest('.kbtn');
  if (!btn) return;
  var d = btn.dataset.d;
  if (d !== undefined) { pushDigit(d); return; }
  if (btn.id === 'btn-back') { clearDigits(); return; }
});

document.getElementById('btn-prev').addEventListener('click', function(){
  if (curSub > 1) loadPage(curPage, curSub - 1);
});
document.getElementById('btn-next').addEventListener('click', function(){
  if (curSub < curSubs) loadPage(curPage, curSub + 1);
});

['red','green','yellow','cyan'].forEach(function(c){
  ftBtns[c].addEventListener('click', function(){ fastextGo(c); });
});

// ---------------------------------------------------------------------------
// Place
// ---------------------------------------------------------------------------
placeBtn.addEventListener('click', setPlace);
placeInput.addEventListener('keydown', function(e){ if (e.key === 'Enter') setPlace(); });

function setPlace() {
  var val = placeInput.value.trim();
  if (!val) return;
  var isCoord = /^-?\d+(\.\d+)?\s*,\s*-?\d+(\.\d+)?$/.test(val);
  var extra;
  if (isCoord) {
    var parts = val.split(',');
    extra = '&lat=' + encodeURIComponent(parts[0].trim()) + '&lon=' + encodeURIComponent(parts[1].trim());
  } else {
    extra = '&place=' + encodeURIComponent(val);
  }
  var url = '/p/101.json?s=1' + extra;
  fetch(url, { credentials: 'include' })
    .then(function(r){ return r.json(); })
    .then(function(data){
      curPage = 101; curSub = 1;
      renderPage(data);
      var rows = data.rows || [];
      for (var i = 0; i < rows.length; i++) {
        var m = rows[i].match(/^Place:\s*(.+?)\s*$/);
        if (m) { placeName.textContent = m[1].trim(); break; }
      }
      history.pushState({ num:101, sub:1 }, '', '/p/101');
    })
    .catch(function(){ showError('Could not set place'); });
}

// ---------------------------------------------------------------------------
// Torch mode
// ---------------------------------------------------------------------------
torchBtn.addEventListener('click', function(){
  torchOn = !torchOn;
  document.body.classList.toggle('torch-on', torchOn);
  torchBtn.textContent = torchOn ? 'On' : 'Off';
  torchBtn.setAttribute('aria-pressed', String(torchOn));
  drawTorch();
});

screenWrap.addEventListener('mousemove', function(e){
  if (!torchOn) return;
  var rect = screenWrap.getBoundingClientRect();
  var y = e.clientY - rect.top;
  torchRow = Math.floor((y / rect.height) * 24);
  torchRow = Math.max(0, Math.min(23, torchRow));
  drawTorch();
});
screenWrap.addEventListener('touchmove', function(e){
  if (!torchOn) return;
  e.preventDefault();
  var rect = screenWrap.getBoundingClientRect();
  var y = e.touches[0].clientY - rect.top;
  torchRow = Math.floor((y / rect.height) * 24);
  torchRow = Math.max(0, Math.min(23, torchRow));
  drawTorch();
}, { passive: false });

function drawTorch() {
  if (!torchOn) {
    rowDivs.forEach(function(r){ r.style.opacity = ''; });
    return;
  }
  for (var i = 0; i < 24; i++) {
    var inBeam = (i >= torchRow - 1 && i <= torchRow + 1);
    rowDivs[i].style.opacity = inBeam ? '1' : '0.2';
  }
}

// ---------------------------------------------------------------------------
// Browser back/forward
// ---------------------------------------------------------------------------
window.addEventListener('popstate', function(e){
  if (e.state && e.state.num) {
    loadPage(e.state.num, e.state.sub || 1);
  }
});

// ---------------------------------------------------------------------------
// Resize
// ---------------------------------------------------------------------------
var resizeTimer;
window.addEventListener('resize', function(){
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(syncLayout, 60);
});

// ---------------------------------------------------------------------------
// Initial load
// ---------------------------------------------------------------------------
(function init(){
  syncLayout();

  var m = window.location.pathname.match(/\/p\/(\d{3})/);
  var initPage = m ? parseInt(m[1], 10) : 100;
  var initSub  = 1;
  var sp = new URLSearchParams(window.location.search).get('s');
  if (sp) initSub = parseInt(sp, 10) || 1;

  var extra = '';
  var qp = new URLSearchParams(window.location.search);
  if (qp.get('place')) extra = '&place=' + encodeURIComponent(qp.get('place'));
  else if (qp.get('lat') && qp.get('lon')) {
    extra = '&lat=' + encodeURIComponent(qp.get('lat')) + '&lon=' + encodeURIComponent(qp.get('lon'));
  }

  history.replaceState({ num:initPage, sub:initSub }, '', window.location.href);
  loadPage(initPage, initSub, extra);
})();

})();
</script>
</body>
</html>
