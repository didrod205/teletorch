<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Teletorch</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#000;color:#fff;font-family:Consolas,"Courier New",Courier,monospace;min-height:100vh;user-select:none}
body{display:flex;flex-direction:column;align-items:center;padding:8px 4px 16px}

/* TV screen wrapper -- 4:3 aspect, max 1100px, min 320px */
#screen-wrap{
  position:relative;
  width:min(calc(100vw - 8px),1100px);
  aspect-ratio:4/3;
  background:#111;
  border:2px solid #333;
  overflow:hidden;
  cursor:crosshair;
}
#screen{
  position:absolute;inset:0;
  display:grid;
  grid-template-columns:1fr;
  grid-template-rows:repeat(24,1fr);
  width:100%;height:100%;
  font-size:clamp(6px,2.1vw,22px);
  line-height:1;
  overflow:hidden;
}
/* Each row is a single div, font-size via parent */
.row{
  display:flex;
  align-items:center;
  white-space:pre;
  overflow:hidden;
  font-family:inherit;
  font-size:inherit;
  font-style:normal;
  padding:0 2px;
  transition:opacity 0.1s;
}
.row span{letter-spacing:0;font-style:normal}

/* Torch overlay -- covers the screen, pointer-events:none */
#torch-overlay{
  position:absolute;inset:0;
  pointer-events:none;
  display:none;
  z-index:5;
}
body.torch-on #torch-overlay{display:block}

/* Colour classes */
.c-white   {color:#fff}
.c-yellow  {color:#ff0}
.c-cyan    {color:#0ff}
.c-green   {color:#0f0}
.c-red     {color:#f00}
.c-magenta {color:#f0f}
.c-blue    {color:#4d7cff}

/* Controls below the screen */
#controls{
  width:min(calc(100vw - 8px),1100px);
  margin-top:8px;
  display:flex;
  flex-direction:column;
  gap:8px;
}

/* Place bar */
#place-bar{
  display:flex;
  gap:6px;
  align-items:center;
  flex-wrap:wrap;
}
#place-bar label{color:#0ff;font-size:clamp(10px,1.8vw,14px)}
#place-input{
  flex:1;min-width:120px;
  background:#111;color:#fff;border:1px solid #444;
  padding:4px 6px;font-family:inherit;
  font-size:clamp(10px,1.8vw,14px);
}
#place-input:focus{outline:1px solid #0ff}
#place-btn{
  background:#111;color:#0ff;border:1px solid #0ff;
  padding:4px 10px;cursor:pointer;font-family:inherit;
  font-size:clamp(10px,1.8vw,14px);
}
#place-btn:hover{background:#0ff;color:#000}
#place-name{color:#0f0;font-size:clamp(9px,1.6vw,13px);min-width:80px}

/* Digit display + keypad row */
#keypad-row{
  display:flex;
  gap:12px;
  align-items:flex-start;
  flex-wrap:wrap;
}
#digit-display{
  font-size:clamp(18px,4vw,36px);
  color:#ff0;letter-spacing:6px;
  width:6ch;text-align:center;
  border-bottom:2px solid #ff0;
  padding:2px 4px;
  min-width:80px;
}

/* Keypad grid */
#keypad{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:4px;
  width:clamp(110px,20vw,180px);
}
.kbtn{
  background:#111;color:#fff;border:1px solid #555;
  padding:clamp(4px,1vw,8px) 0;
  cursor:pointer;font-family:inherit;
  font-size:clamp(11px,2vw,16px);
  text-align:center;
}
.kbtn:hover{background:#333}
.kbtn:active{background:#555}
.kbtn-back{color:#ff0;border-color:#ff0}
.kbtn-back:hover{background:#332200}

/* Sub-page arrows */
#subpage-btns{
  display:flex;flex-direction:column;gap:4px;
  justify-content:center;
}
.spbtn{
  background:#111;color:#fff;border:1px solid #555;
  padding:4px 10px;cursor:pointer;font-family:inherit;
  font-size:clamp(11px,2vw,16px);
}
.spbtn:hover{background:#333}

/* Fastext buttons */
#fastext-row{
  display:flex;gap:6px;flex-wrap:wrap;
}
.fbtn{
  flex:1;min-width:60px;
  padding:clamp(4px,1vw,8px) 4px;
  background:#111;border:none;
  cursor:pointer;font-family:inherit;
  font-size:clamp(10px,1.8vw,14px);
  text-align:center;font-style:normal;
}
.fbtn:hover{filter:brightness(1.3)}
.fbtn:active{filter:brightness(0.7)}
.fbtn-red    {color:#f00;border:1px solid #f00}
.fbtn-green  {color:#0f0;border:1px solid #0f0}
.fbtn-yellow {color:#ff0;border:1px solid #ff0}
.fbtn-cyan   {color:#0ff;border:1px solid #0ff}

/* Torch toggle */
#torch-row{
  display:flex;align-items:center;gap:8px;
}
#torch-label{color:#888;font-size:clamp(9px,1.6vw,13px)}
#torch-btn{
  background:#111;color:#888;border:1px solid #444;
  padding:3px 10px;cursor:pointer;font-family:inherit;
  font-size:clamp(9px,1.6vw,13px);
}
body.torch-on #torch-btn{color:#ff0;border-color:#ff0}

/* Footer */
#footer{
  margin-top:8px;
  color:#555;
  font-size:clamp(8px,1.4vw,11px);
  text-align:center;
}
#footer a{color:#4d7cff;text-decoration:none}
#footer a:hover{text-decoration:underline}

/* Aria-live hidden text */
#a11y-text{
  position:absolute;
  width:1px;height:1px;
  overflow:hidden;clip:rect(0,0,0,0);
  white-space:pre;
}
</style>
</head>
<body>

<div id="screen-wrap" tabindex="0" aria-label="Teletext screen" role="region">
  <div id="screen" aria-hidden="true"></div>
  <canvas id="torch-overlay" aria-hidden="true"></canvas>
</div>

<div id="controls">
  <div id="place-bar">
    <label for="place-input">Place:</label>
    <input id="place-input" type="text" placeholder="City or lat,lon" autocomplete="off" aria-label="Set place">
    <button id="place-btn" aria-label="Set place">Set</button>
    <span id="place-name" aria-live="polite"></span>
  </div>

  <div id="keypad-row">
    <div>
      <div id="digit-display" aria-live="polite" aria-label="Page number being typed">---</div>
    </div>
    <div id="keypad" role="group" aria-label="Page number keypad">
      <button class="kbtn" data-d="1" aria-label="1">1</button>
      <button class="kbtn" data-d="2" aria-label="2">2</button>
      <button class="kbtn" data-d="3" aria-label="3">3</button>
      <button class="kbtn" data-d="4" aria-label="4">4</button>
      <button class="kbtn" data-d="5" aria-label="5">5</button>
      <button class="kbtn" data-d="6" aria-label="6">6</button>
      <button class="kbtn" data-d="7" aria-label="7">7</button>
      <button class="kbtn" data-d="8" aria-label="8">8</button>
      <button class="kbtn" data-d="9" aria-label="9">9</button>
      <button class="kbtn kbtn-back" id="btn-back" aria-label="Back/clear">Bk</button>
      <button class="kbtn" data-d="0" aria-label="0">0</button>
      <button class="kbtn" id="btn-go" aria-label="Go to page">Go</button>
    </div>
    <div id="subpage-btns" aria-label="Sub-page navigation">
      <button class="spbtn" id="btn-prev" aria-label="Previous sub-page">&lt; Prev</button>
      <button class="spbtn" id="btn-next" aria-label="Next sub-page">Next &gt;</button>
    </div>
  </div>

  <div id="fastext-row" role="group" aria-label="Fastext quick links">
    <button class="fbtn fbtn-red"    id="ft-red"    aria-label="Red fastext">---</button>
    <button class="fbtn fbtn-green"  id="ft-green"  aria-label="Green fastext">---</button>
    <button class="fbtn fbtn-yellow" id="ft-yellow" aria-label="Yellow fastext">---</button>
    <button class="fbtn fbtn-cyan"   id="ft-cyan"   aria-label="Cyan fastext">---</button>
  </div>

  <div id="torch-row">
    <span id="torch-label">Torch:</span>
    <button id="torch-btn" aria-pressed="false" aria-label="Toggle torch mode">Off</button>
  </div>
</div>

<div id="footer">
  Data: USGS, NASA EONET, Open-Meteo (<a href="/p/199" target="_blank">CC BY 4.0</a>).
  Also as text: <a href="/p/100.txt">/p/100.txt</a>
</div>

<!-- Visually hidden aria-live text block -->
<pre id="a11y-text" aria-live="polite" aria-atomic="true"></pre>

<script>
(function(){
'use strict';

// ---------------------------------------------------------------------------
// State
// ---------------------------------------------------------------------------
var curPage   = 100;
var curSub    = 1;
var curSubs   = 1;
var curLinks  = [];
var digits    = '';   // 0-3 chars being typed
var torchOn   = false;
var torchRow  = 12;   // 0-23, beam centre
var fetchCtrl = null; // AbortController for in-flight fetch

// ---------------------------------------------------------------------------
// Colour map
// ---------------------------------------------------------------------------
var COL = {
  white:   '#ffffff',
  yellow:  '#ffff00',
  cyan:    '#00ffff',
  green:   '#00ff00',
  red:     '#ff0000',
  magenta: '#ff00ff',
  blue:    '#4d7cff'
};

// ---------------------------------------------------------------------------
// DOM refs
// ---------------------------------------------------------------------------
var screen      = document.getElementById('screen');
var overlay     = document.getElementById('torch-overlay');
var digitDisp   = document.getElementById('digit-display');
var placeInput  = document.getElementById('place-input');
var placeBtn    = document.getElementById('place-btn');
var placeName   = document.getElementById('place-name');
var torchBtn    = document.getElementById('torch-btn');
var a11yText    = document.getElementById('a11y-text');
var screenWrap  = document.getElementById('screen-wrap');
var ftBtns      = {
  red:    document.getElementById('ft-red'),
  green:  document.getElementById('ft-green'),
  yellow: document.getElementById('ft-yellow'),
  cyan:   document.getElementById('ft-cyan')
};

// ---------------------------------------------------------------------------
// Build the 24 row divs once
// ---------------------------------------------------------------------------
var rowDivs = [];
for (var i = 0; i < 24; i++) {
  var d = document.createElement('div');
  d.className = 'row';
  var sp = document.createElement('span');
  d.appendChild(sp);
  screen.appendChild(d);
  rowDivs.push(sp);
}

// ---------------------------------------------------------------------------
// Render page data into the screen
// ---------------------------------------------------------------------------
function renderPage(data) {
  var rows   = data.rows   || [];
  var colors = data.colors || [];
  curLinks = data.links || [];
  curSubs  = data.subs  || 1;
  curSub   = data.sub   || 1;

  var plainText = '';
  for (var i = 0; i < 24; i++) {
    var text  = rows[i]   || '                                        ';
    var color = colors[i] || 'white';
    var col   = COL[color] || '#ffffff';
    rowDivs[i].textContent  = text;
    rowDivs[i].style.color  = col;
    plainText += text + '\n';
  }

  // Aria-live text
  a11yText.textContent = (data.title || '') + '\n' + plainText;

  // Fastext labels
  var colorOrder = ['red','green','yellow','cyan'];
  colorOrder.forEach(function(c){ ftBtns[c].textContent = '---'; ftBtns[c].dataset.num = ''; });
  curLinks.forEach(function(lk){
    if (ftBtns[lk.color]) {
      ftBtns[lk.color].textContent = lk.num + ' ' + (lk.label || '');
      ftBtns[lk.color].dataset.num = lk.num;
    }
  });

  // Place name from cookie / data
  if (data.placeName) placeName.textContent = data.placeName;

  drawTorch();
}

// ---------------------------------------------------------------------------
// Fetch a page
// ---------------------------------------------------------------------------
function loadPage(num, sub, extra) {
  sub  = sub  || 1;
  extra = extra || '';
  if (fetchCtrl) fetchCtrl.abort();
  fetchCtrl = (typeof AbortController !== 'undefined') ? new AbortController() : null;

  var url = '/p/' + String(num).padStart(3,'0') + '.json?s=' + sub + extra;
  var opts = { credentials: 'include' };
  if (fetchCtrl) opts.signal = fetchCtrl.signal;

  fetch(url, opts)
    .then(function(r){ return r.json(); })
    .then(function(data){
      curPage = num;
      curSub  = sub;
      curSubs = data.subs || 1;
      renderPage(data);
      var histUrl = '/p/' + String(num).padStart(3,'0') + (sub > 1 ? '?s=' + sub : '');
      if (window.location.pathname !== '/p/' + String(num).padStart(3,'0')) {
        history.pushState({ num:num, sub:sub }, '', histUrl);
      }
    })
    .catch(function(e){
      if (e && e.name === 'AbortError') return;
      showError('Failed to load page ' + num);
    });
}

function showError(msg) {
  var blank = '                                        ';
  for (var i = 0; i < 24; i++) {
    rowDivs[i].textContent = blank;
    rowDivs[i].style.color = '#ffffff';
  }
  rowDivs[1].textContent = 'ERROR                                   ';
  rowDivs[1].style.color = '#ff0000';
  rowDivs[3].textContent = (msg + blank).slice(0, 40);
  rowDivs[3].style.color = '#ffffff';
  a11yText.textContent = 'Error: ' + msg;
}

// ---------------------------------------------------------------------------
// Digit entry
// ---------------------------------------------------------------------------
function pushDigit(d) {
  if (digits.length >= 3) digits = '';
  digits += d;
  digitDisp.textContent = (digits + '---').slice(0, 3);
  if (digits.length === 3) {
    var num = parseInt(digits, 10);
    digits = '';
    digitDisp.textContent = '---';
    loadPage(num, 1);
  }
}

function clearDigits() {
  digits = '';
  digitDisp.textContent = '---';
}

// ---------------------------------------------------------------------------
// Keyboard
// ---------------------------------------------------------------------------
document.addEventListener('keydown', function(e) {
  // Don't capture when typing in the place input
  if (document.activeElement === placeInput) return;

  if (e.key >= '0' && e.key <= '9') { e.preventDefault(); pushDigit(e.key); return; }
  if (e.key === 'Backspace') { e.preventDefault(); clearDigits(); return; }
  if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
    e.preventDefault();
    if (curSub < curSubs) loadPage(curPage, curSub + 1);
    return;
  }
  if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
    e.preventDefault();
    if (curSub > 1) loadPage(curPage, curSub - 1);
    return;
  }
  if (e.key === 'F1' || e.key === 'r') { e.preventDefault(); fastextGo('red');    return; }
  if (e.key === 'F2' || e.key === 'g') { e.preventDefault(); fastextGo('green');  return; }
  if (e.key === 'F3' || e.key === 'y') { e.preventDefault(); fastextGo('yellow'); return; }
  if (e.key === 'F4' || e.key === 'c') { e.preventDefault(); fastextGo('cyan');   return; }
  // Torch beam move with keyboard
  if (torchOn) {
    if (e.key === 'ArrowUp')   { e.preventDefault(); torchRow = Math.max(0,  torchRow - 1); drawTorch(); return; }
    if (e.key === 'ArrowDown') { e.preventDefault(); torchRow = Math.min(23, torchRow + 1); drawTorch(); return; }
  }
});

function fastextGo(color) {
  var btn = ftBtns[color];
  if (btn && btn.dataset.num) loadPage(parseInt(btn.dataset.num, 10), 1);
}

// ---------------------------------------------------------------------------
// Keypad buttons
// ---------------------------------------------------------------------------
document.getElementById('keypad').addEventListener('click', function(e) {
  var btn = e.target.closest('.kbtn');
  if (!btn) return;
  var d = btn.dataset.d;
  if (d !== undefined) { pushDigit(d); return; }
  if (btn.id === 'btn-back') { clearDigits(); return; }
  if (btn.id === 'btn-go') {
    if (digits.length > 0) {
      var num = parseInt(digits.padEnd(3,'0'), 10);
      digits = '';
      digitDisp.textContent = '---';
      loadPage(num, 1);
    }
    return;
  }
});

document.getElementById('btn-prev').addEventListener('click', function(){
  if (curSub > 1) loadPage(curPage, curSub - 1);
});
document.getElementById('btn-next').addEventListener('click', function(){
  if (curSub < curSubs) loadPage(curPage, curSub + 1);
});

// Fastext buttons
['red','green','yellow','cyan'].forEach(function(c){
  ftBtns[c].addEventListener('click', function(){ fastextGo(c); });
});

// ---------------------------------------------------------------------------
// Place
// ---------------------------------------------------------------------------
placeBtn.addEventListener('click', setPlace);
placeInput.addEventListener('keydown', function(e){ if (e.key === 'Enter') setPlace(); });

function setPlace() {
  var val = placeInput.value.trim();
  if (!val) return;
  // Determine if it's lat,lon or a name
  var isCoord = /^-?\d+(\.\d+)?\s*,\s*-?\d+(\.\d+)?$/.test(val);
  var extra;
  if (isCoord) {
    var parts = val.split(',');
    extra = '&lat=' + encodeURIComponent(parts[0].trim()) + '&lon=' + encodeURIComponent(parts[1].trim());
  } else {
    extra = '&place=' + encodeURIComponent(val);
  }
  // Load page 101 with the place param; cookie will be set by server
  var url = '/p/101.json?s=1' + extra;
  fetch(url, { credentials: 'include' })
    .then(function(r){ return r.json(); })
    .then(function(data){
      curPage = 101; curSub = 1;
      renderPage(data);
      // Extract place name from the rendered rows (row 2 starts "Place: ...")
      var rows = data.rows || [];
      for (var i = 0; i < rows.length; i++) {
        var m = rows[i].match(/^Place:\s*(.+?)\s*$/);
        if (m) { placeName.textContent = m[1].trim(); break; }
      }
      history.pushState({ num:101, sub:1 }, '', '/p/101');
    })
    .catch(function(){ showError('Could not set place'); });
}

// ---------------------------------------------------------------------------
// Torch mode
// ---------------------------------------------------------------------------
torchBtn.addEventListener('click', function(){
  torchOn = !torchOn;
  document.body.classList.toggle('torch-on', torchOn);
  torchBtn.textContent = torchOn ? 'On' : 'Off';
  torchBtn.setAttribute('aria-pressed', String(torchOn));
  drawTorch();
});

// Pointer / touch moves the beam
screenWrap.addEventListener('mousemove', function(e){
  if (!torchOn) return;
  var rect = screenWrap.getBoundingClientRect();
  var y = e.clientY - rect.top;
  torchRow = Math.floor((y / rect.height) * 24);
  torchRow = Math.max(0, Math.min(23, torchRow));
  drawTorch();
});
screenWrap.addEventListener('touchmove', function(e){
  if (!torchOn) return;
  e.preventDefault();
  var rect = screenWrap.getBoundingClientRect();
  var y = e.touches[0].clientY - rect.top;
  torchRow = Math.floor((y / rect.height) * 24);
  torchRow = Math.max(0, Math.min(23, torchRow));
  drawTorch();
}, { passive: false });

function drawTorch() {
  if (!torchOn) {
    // Remove dim from all rows
    rowDivs.forEach(function(r){ r.parentNode.style.opacity = ''; });
    return;
  }
  // Dim rows outside the 3-row band
  for (var i = 0; i < 24; i++) {
    var row = rowDivs[i].parentNode;
    var inBeam = (i >= torchRow - 1 && i <= torchRow + 1);
    row.style.opacity = inBeam ? '1' : '0.25';
  }
}

// ---------------------------------------------------------------------------
// Browser back/forward
// ---------------------------------------------------------------------------
window.addEventListener('popstate', function(e){
  if (e.state && e.state.num) {
    loadPage(e.state.num, e.state.sub || 1);
  }
});

// ---------------------------------------------------------------------------
// Resize: keep canvas in sync (torch overlay sized to match wrapper)
// ---------------------------------------------------------------------------
function syncCanvas() {
  overlay.width  = screenWrap.offsetWidth;
  overlay.height = screenWrap.offsetHeight;
}
window.addEventListener('resize', syncCanvas);

// ---------------------------------------------------------------------------
// Font size: ensure 40 chars fill the row exactly
// We compute cell width = wrapper_width / 40, set font-size to that * 0.6
// (approximate monospace em ~0.6 of font-size; clamp in CSS handles extremes)
// ---------------------------------------------------------------------------
function syncFont() {
  var w = screenWrap.offsetWidth;
  var h = screenWrap.offsetHeight;
  // font-size such that 40 chars fill width
  // monospace char width ≈ 0.6 * font-size; so font-size = w / (40 * 0.6)
  var fs = Math.max(6, Math.min(22, (w / 40) * 0.6));
  screen.style.fontSize = fs + 'px';
  // Also row height should be h/24
  // We use grid so that's automatic; just ensure no overflow
}
window.addEventListener('resize', syncFont);

// ---------------------------------------------------------------------------
// Initial load
// ---------------------------------------------------------------------------
(function init(){
  syncCanvas();
  syncFont();

  // Determine initial page from URL path /p/<num>
  var m = window.location.pathname.match(/\/p\/(\d{3})/);
  var initPage = m ? parseInt(m[1], 10) : 100;
  var initSub  = 1;
  var sp = new URLSearchParams(window.location.search).get('s');
  if (sp) initSub = parseInt(sp, 10) || 1;

  // Pass any place params from URL query
  var extra = '';
  var qp = new URLSearchParams(window.location.search);
  if (qp.get('place')) extra = '&place=' + encodeURIComponent(qp.get('place'));
  else if (qp.get('lat') && qp.get('lon')) {
    extra = '&lat=' + encodeURIComponent(qp.get('lat')) + '&lon=' + encodeURIComponent(qp.get('lon'));
  }

  history.replaceState({ num:initPage, sub:initSub }, '', window.location.href);
  loadPage(initPage, initSub, extra);
})();

})();
</script>
</body>
</html>
